<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ติดตามสถานะ - กนค. HELPDESK</title>
  
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between selection:bg-pink-200">

  <div class="relative">
    
    <!-- 🌸 Header ส่วนแบนเนอร์สีชมพูด้านบน -->
    <header class="bg-[#ff5a85] text-white pt-10 pb-28 px-4 shadow-sm text-center relative">
      <div class="max-w-md mx-auto flex flex-col items-center">
        <!-- ปุ่มย้อนกลับหน้าหลัก -->
        <a href="index.html" class="absolute top-4 left-4 bg-white/20 hover:bg-white/30 text-white px-3.5 py-1.5 rounded-full text-xs font-semibold backdrop-blur-sm transition-all flex items-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-arrow-left"></i>
          <span>หน้าหลัก</span>
        </a>

        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wide mt-2">
          ติดตามสถานะเรื่องร้องเรียน
        </h1>
        <p class="text-xs font-light opacity-90 mt-1">
          คณะกรรมการนิสิตปริญญาบัณฑิตคณะครุศาสตร์
        </p>
      </div>
    </header>

    <!-- ⚪ Main Content การ์ดสีขาวลอยทับแบนเนอร์ ( relative z-10 ) -->
    <main class="px-4 -mt-16 mb-10 flex justify-center relative z-10">
      <div class="bg-white w-full max-w-md rounded-[2.5rem] p-6 sm:p-8 shadow-xl shadow-pink-200/30 border border-pink-50">
        
        <p class="text-xs text-gray-500 mb-5 text-center font-medium">
          กรอกรหัสติดตามเรื่องร้องเรียน (Ticket ID) เพื่อตรวจสอบความคืบหน้า
        </p>

        <!-- ฟอร์มค้นหา Ticket ID -->
        <form id="searchForm" class="space-y-3 mb-6">
          <div class="relative">
            <input type="text" id="ticketIdInput" required placeholder="เช่น TK-0000" 
                   class="w-full bg-slate-50 border border-slate-200 focus:border-[#ff5a85] focus:bg-white text-gray-800 text-sm font-semibold rounded-2xl p-3.5 pl-11 outline-none transition-all uppercase placeholder:normal-case placeholder:font-normal placeholder:text-gray-400">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
          </div>
          
          <button type="submit" id="searchBtn" 
                  class="w-full bg-[#ff5a85] hover:bg-[#f44374] text-white font-bold py-3.5 rounded-2xl shadow-md shadow-pink-200 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm">
            <span>ตรวจสอบสถานะ</span>
          </button>
        </form>

        <!-- พื้นที่แสดงสถานะ (ซ่อนไว้ก่อนจนกว่าจะค้นหา) -->
        <div id="resultArea" class="hidden">
          
          <!-- Card รายละเอียดเรื่อง -->
          <div class="bg-slate-50 rounded-2xl p-4 sm:p-5 border border-slate-100 space-y-3.5">
            
            <!-- แถบ Header: ID & Badge สถานะ -->
            <div class="flex items-center justify-between pb-3 border-b border-slate-200/80">
              <div>
                <span class="text-[10px] text-gray-400 font-semibold block uppercase">รหัสเรื่องร้องเรียน</span>
                <span id="resTicketId" class="text-sm font-bold text-gray-800"></span>
              </div>
              <span id="resStatusBadge" class="px-3 py-1 rounded-full text-xs font-semibold"></span>
            </div>

            <!-- รายละเอียดทั่วไป -->
            <div class="space-y-2.5 text-xs">
              <div class="flex justify-between items-center">
                <span class="text-gray-400 font-medium">วันที่แจ้ง:</span>
                <span id="resDate" class="text-gray-700 font-semibold"></span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-gray-400 font-medium">รหัสนิสิต:</span>
                <span id="resStudentId" class="text-gray-700 font-semibold"></span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-gray-400 font-medium">ผู้แจ้ง:</span>
                <span id="resName" class="text-gray-700 font-semibold"></span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-gray-400 font-medium">หมวดหมู่:</span>
                <span id="resCategory" class="text-gray-700 font-semibold bg-white px-2.5 py-0.5 rounded-md border border-slate-200"></span>
              </div>
              <div class="pt-1">
                <span class="text-gray-400 block font-medium mb-1">รายละเอียด:</span>
                <p id="resDetail" class="text-gray-700 bg-white p-3 rounded-xl border border-slate-100 leading-relaxed whitespace-pre-line"></p>
              </div>
              
              <!-- รูปภาพแนบ (แสดงเฉพาะกรณีมีรูป) -->
              <div id="resImageWrapper" class="hidden pt-2">
                <span class="text-gray-400 block font-medium mb-1.5">รูปภาพประกอบ:</span>
                <a id="resImageLink" href="#" target="_blank" class="inline-block group">
                  <img id="resImage" src="" class="max-h-36 rounded-xl border border-slate-200 group-hover:opacity-90 transition-opacity object-cover">
                </a>
              </div>
            </div>

            <!-- ส่วนหมายเหตุ / การตอบกลับจากเจ้าหน้าที่ -->
            <div id="resReplyBox" class="hidden pt-3 border-t border-slate-200/80">
              <span class="text-xs text-[#ff5a85] font-semibold flex items-center gap-1.5 mb-1.5">
                <i class="fa-solid fa-comment-dots"></i> ข้อความจากเจ้าหน้าที่:
              </span>
              <div id="resReplyText" class="text-xs text-gray-700 bg-pink-50/60 border border-pink-100 p-3 rounded-xl leading-relaxed"></div>
            </div>

          </div>

        </div>

        <!-- พื้นที่แสดง ข้อความแจ้งเตือน / ไม่พบข้อมูล / กำลังโหลด -->
        <div id="messageArea" class="hidden text-center py-8 space-y-2">
          <div id="messageIcon" class="text-3xl text-gray-300"></div>
          <p id="messageText" class="text-sm font-semibold text-gray-500"></p>
        </div>

      </div>
    </main>
  </div>



  <!-- 1. ดึงไฟล์ config.js มาใช้งานก่อน -->
  <script src="config.js"></script>

  <!-- 2. โค้ดทำงานของ tracking.html -->
  <script>
    // ดึงค่า Ticket ID จาก URL Parameter (ถ้ามี)
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const ticketId = urlParams.get('id');
      if (ticketId) {
        document.getElementById('ticketIdInput').value = ticketId.trim();
        searchTicket(ticketId.trim());
      }
    });

    // ส่งฟอร์มค้นหา
    document.getElementById('searchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const ticketId = document.getElementById('ticketIdInput').value.trim();
      if (ticketId) {
        searchTicket(ticketId);
      }
    });

    // ฟังก์ชันค้นหาข้อมูล Ticket ID
    async function searchTicket(ticketId) {
      const searchBtn = document.getElementById('searchBtn');
      const resultArea = document.getElementById('resultArea');
      const messageArea = document.getElementById('messageArea');

      // ตรวจสอบ SCRIPT_URL จาก CONFIG
      if (typeof CONFIG === 'undefined' || !CONFIG.SCRIPT_URL) {
        alert("กรุณาตั้งค่า SCRIPT_URL ในไฟล์ config.js ก่อนครับ!");
        return;
      }

      // ซ่อนผลลัพธ์เดิมและแสดงสถานะ Loading
      resultArea.classList.add('hidden');
      messageArea.classList.remove('hidden');
      showMessage('<i class="fa-solid fa-spinner fa-spin text-[#ff5a85]"></i>', 'กำลังค้นหาข้อมูล...');

      searchBtn.disabled = true;
      searchBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> กำลังค้นหา...`;

      try {
        const response = await fetch(`${CONFIG.SCRIPT_URL}?action=getTicket&id=${encodeURIComponent(ticketId)}`);
        const result = await response.json();

        if (result.status === 'success' && result.data) {
          let ticketData = null;

          // ถ้า API ส่งมาเป็น Array (รายการทั้งหมด) ให้ค้นหาเฉพาะ Ticket ID ที่ระบุ
          if (Array.isArray(result.data)) {
            ticketData = result.data.find(item => {
              const itemTicketId = (item.ID || item.ticketId || '').toString().trim().toLowerCase();
              return itemTicketId === ticketId.trim().toLowerCase();
            });
          } else {
            ticketData = result.data;
          }

          if (ticketData) {
            messageArea.classList.add('hidden');
            renderTicketData(ticketData);
            resultArea.classList.remove('hidden');
          } else {
            showMessage('<i class="fa-solid fa-circle-exclamation text-amber-500"></i>', 'ไม่พบข้อมูลเรื่องร้องเรียนนี้ กรุณาตรวจสอบ รหัสติดตาม อีกครั้ง');
          }
        } else {
          showMessage('<i class="fa-solid fa-circle-exclamation text-amber-500"></i>', 'ไม่พบข้อมูลเรื่องร้องเรียนนี้ กรุณาตรวจสอบ รหัสติดตาม อีกครั้ง');
        }
      } catch (error) {
        console.error(error);
        showMessage('<i class="fa-solid fa-triangle-exclamation text-red-500"></i>', 'เกิดข้อผิดพลาดในการดึงข้อมูล กรุณาลองใหม่อีกครั้ง');
      } finally {
        searchBtn.disabled = false;
        searchBtn.innerHTML = `<span>ตรวจสอบสถานะ</span>`;
      }
    }

    // ฟังก์ชันแสดงข้อมูลเรื่องร้องเรียน
    function renderTicketData(data) {
      // ดึงค่าโดยรองรับชื่อ Key ทั้งไทยและอังกฤษ
      document.getElementById('resTicketId').innerText = data.ID || data.ticketId || '-';
      document.getElementById('resDate').innerText = formatDate(data.Timestamp || data.timestamp);
      document.getElementById('resStudentId').innerText = data.Student_ID || data.studentId || '-';
      document.getElementById('resName').innerText = data.ชื่อ_นามสกุล || data.name || '-';
      document.getElementById('resCategory').innerText = data.หมวดหมู่ปัญหา || data.category || '-';
      document.getElementById('resDetail').innerText = data.รายละเอียด || data.detail || '-';

      // จัดการ Badge สถานะ
      const statusBadge = document.getElementById('resStatusBadge');
      const status = data.สถานะ || data.status || 'รอดำเนินการ';
      statusBadge.innerText = status;

      if (status === 'รอดำเนินการ') {
        statusBadge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-700';
      } else if (status === 'กำลังดำเนินการ') {
        statusBadge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700';
      } else if (status === 'เสร็จสิ้น' || status === 'แก้ไขแล้ว') {
        statusBadge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700';
      } else {
        statusBadge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-700';
      }

      // แสดงรูปภาพแนบ
      const imgUrl = data.รูปภาพแนบ || data.imageUrl || data.รูปภาพ || '';
      const imgWrapper = document.getElementById('resImageWrapper');
      if (imgUrl && imgUrl.trim() !== '' && imgUrl !== '-') {
        document.getElementById('resImage').src = imgUrl;
        document.getElementById('resImageLink').href = imgUrl;
        imgWrapper.classList.remove('hidden');
      } else {
        imgWrapper.classList.add('hidden');
      }

      // แสดงการตอบกลับจากเจ้าหน้าที่
      const replyText = data.การตอบกลับจากเจ้าหน้าที่ || data.reply || data.การตอบกลับ || '';
      const replyBox = document.getElementById('resReplyBox');
      if (replyText && replyText.trim() !== '' && replyText !== '-') {
        document.getElementById('resReplyText').innerText = replyText;
        replyBox.classList.remove('hidden');
      } else {
        replyBox.classList.add('hidden');
      }
    }

    // ฟังก์ชันจัดฟอร์แมตวันที่ให้สวยงาม
    function formatDate(rawDate) {
      if (!rawDate) return '-';
      try {
        const d = new Date(rawDate);
        if (isNaN(d.getTime())) return rawDate;
        return d.toLocaleDateString('th-TH', {
          day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit', hour12: false
        });
      } catch (e) {
        return rawDate;
      }
    }

    // ฟังก์ชันช่วยแสดงข้อความแจ้งเตือน
    function showMessage(iconHtml, text) {
      document.getElementById('messageIcon').innerHTML = iconHtml;
      document.getElementById('messageText').innerText = text;
    }
  </script>

</body>
</html>
